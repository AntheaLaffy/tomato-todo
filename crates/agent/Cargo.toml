[package]
name = "tomato-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tomato-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal"] }

[dev-dependencies]
tempfile = "3"
