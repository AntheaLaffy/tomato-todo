name: CI

# Documentation-only changes do not need a build; docs/*.json schemas and
# examples are read by tests, so only Markdown and the license are ignored.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

# 重写后的验证范围：TS 核心与 runtime 测试、prettier 只检查、手册结构、
# guard 的 Linux 构建与 Windows/macOS 类型检查。旧壳与 agent 栈已在重写中删除
# （MIGRATION.md 阶段 5），原四平台桌面构建、隔离桌面回归、Playwright 浏览器
# 测试与 Android 任务全部随栈移除。
jobs:
  test:
    name: Check and test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # runtime 目标 node24（scripts/build-runtime.mjs），CI 用同一主版本跑测试。
          node-version: "24"
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Core tests
        run: pnpm core:test

      - name: Runtime tests
        run: pnpm runtime:test

      # CI 只检查、不改写：格式不符直接报错。runtime/ 与 plugin/ 由并行工作流落地，
      # 本分支可能暂缺；目录不存在时跳过对应检查，目录合并后自动生效。
      - name: Prettier check
        run: |
          pnpm exec prettier --check "packages/**/*.ts" scripts tests
          if [ -d runtime ]; then pnpm exec prettier --check "runtime/**/*.{ts,mjs}"; fi
          if [ -d plugin ]; then pnpm exec prettier --check "plugin/**/*.{js,json,yml}"; fi

      # 迁移自测：与 scripts/export-sqlite.mjs 同批落地，防止导出语义漂移。
      - name: SQLite export migration test
        run: node --test scripts/export-sqlite.test.mjs

      # 只做校验，不跑会重写文件的三条生成器：行数会随每次代码改动变化，
      # 让它们在 CI 里改文件既没意义也会把无关 PR 变红。
      - name: Handbook structure check
        run: python3 scripts/check-handbook.py

      # crates/guard 由并行工作流落地；--locked 依赖根 Cargo.lock 收录 guard 依赖，
      # 构建与锁文件保持一致。Linux 上做完整构建：guard 是唯一在真实 Linux 桌面运行的原生目标。
      - name: Build guard (Linux)
        run: cargo build --locked --manifest-path crates/guard/Cargo.toml

  # Windows/macOS 只做类型检查、不做构建：guard 的 X11/Wayland 绑定只在 Linux 完整构建，
  # 矩阵的价值是尽早暴露跨平台编译错误。
  guard-check:
    name: Guard / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-2022
          - macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check guard (type check only)
        run: cargo check --locked --manifest-path crates/guard/Cargo.toml
