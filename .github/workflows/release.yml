name: Release

# Tag pushes such as v0.1.0 publish a GitHub Release with the Linux packages.
# The workflow can also be started by hand from an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and publish Linux packages
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file curl wget \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build Debian package
        run: npm run desktop:deb

      - name: Assemble standalone archive
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p dist/release/stage
          cp target/release/tomato-todo dist/release/stage/
          cp scripts/install.py dist/release/stage/
          cp README.md dist/release/stage/
          tar -czf "dist/release/tomato-todo-${VERSION}-x86_64-linux.tar.gz" -C dist/release/stage .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 番茄 Todo ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          body_path: .github/releases/${{ env.RELEASE_TAG }}.md
          files: |
            target/release/bundle/deb/*.deb
            dist/release/*.tar.gz
