name: Release

# This release line publishes native Linux (including niri) and Windows packages.
# The workflow can also be started by hand from an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Package / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            bundles: deb
          - runner: ubuntu-24.04-arm
            arch: aarch64
            bundles: deb
          - runner: windows-2022
            arch: x86_64
            bundles: nsis
          # Windows ARM64 安装包延后，与 macOS 一致；原因见 docs/CROSS_PLATFORM.md。
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file curl wget \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build host agent runtime
        run: pnpm run agent:build

      - name: Check packaged Node and Pi SDK
        run: node --test tests/agent-runtime.mjs

      - name: Build native package
        env:
          DESKTOP_BUNDLES: ${{ matrix.bundles }}
        run: pnpm exec tauri build --bundles "$env:DESKTOP_BUNDLES"
        if: runner.os == 'Windows'

      - name: Build native package
        env:
          DESKTOP_BUNDLES: ${{ matrix.bundles }}
        run: pnpm exec tauri build --bundles "$DESKTOP_BUNDLES"
        if: runner.os != 'Windows'

      - name: Assemble standalone archive
        if: runner.os == 'Linux'
        env:
          DESKTOP_ARCH: ${{ matrix.arch }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p dist/release/stage
          cp target/release/tomato-todo dist/release/stage/
          cp scripts/install.py dist/release/stage/
          cp README.md dist/release/stage/
          cp -a agent/bundle dist/release/stage/agent
          cp -a src-tauri/icons dist/release/stage/icons
          tar -czf "dist/release/tomato-todo-${VERSION}-${DESKTOP_ARCH}-linux.tar.gz" -C dist/release/stage .

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.runner }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/nsis/*.exe
            dist/release/*.tar.gz

  publish:
    name: Publish Linux and Windows packages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 番茄 Todo ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          body_path: .github/releases/${{ env.RELEASE_TAG }}.md
          files: |
            packages/**/*.deb
            packages/**/*.exe
            packages/**/*.tar.gz
