name: Release

# 发版产物 = 一个 Linux tarball：runtime（bin + src + vendor）+ guard + 插件目录 +
# 安装脚本。用户解包后跑 scripts/install.mjs 装两个进程，再把 plugin/ 以 link:
# 挂进 DSH profile，就得到完整功能；AUR 的 -bin 包消费同一份 tarball。
#
# 旧的 Tauri 流程（tauri build / .deb / NSIS / 桌面图标）已随旧栈删除，这里不再
# 假装能产出安装器。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.13.0)"
        required: true

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  linux:
    name: 构建 / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/guard

      # gio 只需要一个可链接的 glib；其余依赖（x11rb / wayland / zbus）是纯 Rust。
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-dev pkg-config

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build runtime and client
        run: |
          pnpm build:runtime
          pnpm build:client

      - name: Build guard
        run: cargo build --release --locked --manifest-path crates/guard/Cargo.toml

      - name: Package tarball
        run: >-
          node scripts/package-release.mjs
          --arch ${{ matrix.arch }}
          --version "${RELEASE_TAG#v}"
          --guard crates/guard/target/release/tomato-guard

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/release/*.tar.gz
            dist/release/*.sha256
          if-no-files-found: error

  publish:
    name: 发布 GitHub Release
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 番茄 Todo ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            assets/*.tar.gz
            assets/*.sha256

  # AUR 是可选的：没有配置 AUR_SSH_KEY 时整步跳过，不阻塞 GitHub Release。
  aur:
    name: 推送 AUR -bin
    needs: publish
    if: ${{ secrets.AUR_SSH_KEY != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: Load AUR SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t rsa aur.archlinux.org >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          EOF

      - name: Publish AUR package
        run: >-
          node scripts/publish-aur.mjs
          --version "${RELEASE_TAG#v}"
          --tarball assets/tomato-todo-${RELEASE_TAG#v}-x86_64-linux.tar.gz
          --push
