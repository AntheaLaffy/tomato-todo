[workspace]
members = ["crates/core", "crates/agent", "crates/preview", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.6.1"
edition = "2021"
license = "MIT"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
incremental = false
strip = true
lto = "thin"
codegen-units = 1
